apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-showcase
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-showcase
  template:
    metadata:
      labels:
        app: devops-showcase
    spec:
      containers:
        - name: devops-showcase
          image: 968021915718.dkr.ecr.ap-south-1.amazonaws.com/devops-showcase:latest
          ports:
            - containerPort: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: devops-showcase
spec:
  type: NodePort
  selector:
    app: devops-showcase
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
